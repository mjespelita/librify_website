<!DOCTYPE html>
<html>
<head>
<title>LibrifyTV</title>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css?family=Amatic+SC');

body {
	margin: 0;
	height: 100%;
	background-image: linear-gradient(to top, #d9afd9 0%, #FF8C00 100%);
	background-repeat: no-repeat;
  background-size: cover;
  background-attachment: fixed;
}

.button_container {
	position: absolute;
  left: 0;
  right: 0;
  top: 5%;
}

.description, .link {
  font-family: 'Amatic SC', cursive;
  text-align: center;
}

.description {
	font-size: 35px;
}

.btn {
  border: none;
  display: block;
  text-align: center;
  cursor: pointer;
  text-transform: uppercase;
  outline: none;
  overflow: hidden;
  position: relative;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  background-color: #222;
  padding: 17px 60px;
  margin: 0 auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.20);
}
.btn2 {
  border: none;
  display: block;
  text-align: center;
  cursor: pointer;
  text-transform: uppercase;
  outline: none;
  overflow: hidden;
  position: relative;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  background-color: #222;
  padding: 17px 60px;
  margin: 0 auto;
  box-shadow: 0 5px 15px rgba(0,0,0,0.20);
}
.btn span {
  position: relative; 
  z-index: 1;
}

.btn:after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 490%;
  width: 140%;
  background: #78c7d2;
  -webkit-transition: all .5s ease-in-out;
  transition: all .5s ease-in-out;
  -webkit-transform: translateX(-98%) translateY(-25%) rotate(45deg);
  transform: translateX(-98%) translateY(-25%) rotate(45deg);
}
.btn2:after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  height: 490%;
  width: 140%;
  background: #d9afd9;
  -webkit-transition: all .5s ease-in-out;
  transition: all .5s ease-in-out;
  -webkit-transform: translateX(-98%) translateY(-25%) rotate(45deg);
  transform: translateX(-98%) translateY(-25%) rotate(45deg);
}

.btn:hover:after {
  -webkit-transform: translateX(-9%) translateY(-25%) rotate(45deg);
  transform: translateX(-9%) translateY(-25%) rotate(45deg);
}
.btn2:hover:after {
  -webkit-transform: translateX(-9%) translateY(-25%) rotate(45deg);
  transform: translateX(-9%) translateY(-25%) rotate(45deg);
}
.link {
  font-size: 20px;
  margin-top: 30px;
}

.link a {
  color: #000;
  font-size: 25px; 
}

</style>
</head>
<body>
<div class="button_container">
	<h1><p class="description">Download Base on your Device Operating System</p></h1>
	<button  id="fb" class="btn2"><h1><p class="description">Message Facebook Support Page if You Need Help</p></h1></button>
	<br>
	<br>
	<button id="android" class="btn"><img src="android.png" onclick="myFunction()" alt="Android Click Here" ></button>
	<br>
	<button id="windows" class="btn"><img src="windows.png" alt="Windows Click Here" ></button>
	<br>
	<button id="mac" class="btn"><img src="mac.png" alt="MAC Click Heret" ></button>
	<br>
	<button id="ios" class="btn"><img src="ios.png" alt="IOS Click Here" ></button>
  <!--<p class="link">
    Design by 
    <a href="https://dribbble.com/skytrip" target="_blank">SkyTrip</a>
  </p>-->
</div>
<script type="text/javascript">
document.getElementById("fb").onclick = function () {
        location.href = "https://www.facebook.com/LibrifyITS/";
		
    };
    document.getElementById("android").onclick = function () {
		
        location.href = "https://www.librifyits.com/android/androidManual.html";
		
    };
	document.getElementById("windows").onclick = function () {
        location.href = "https://www.iptvsmarters.com/IPTVSmartersPro-Setup-1.1.1.exe";
    };
	document.getElementById("mac").onclick = function () {
        location.href = "https://www.iptvsmarters.com/IPTVSmartersPro-1.1.1.dmg";
    };
	document.getElementById("ios").onclick = function () {
         location.href = "https://www.librifyits.com/iosManual.html";
		
    };
</script>
</body>
</html>
